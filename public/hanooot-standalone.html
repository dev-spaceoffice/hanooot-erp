document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n:root{--accent:#1D4ED8;--bg:#F5F3EE;--surf:#FFFFFF;--surf2:#EFEDE6;--ink:#1F1E1B;--muted:#78736A;--line:#E4E0D6;--bw:1px;--rad:12px;--radSm:9px;--railBg:#211F1B;--railInk:#EDE9E0;--railMuted:#8D877C;--shadow:0 1px 2px rgba(62,54,42,0.05),0 1px 3px rgba(62,54,42,0.04);--inputBg:#FBFAF7;--warnBg:#FBF4E4;--warnFg:#8A5A12;--danger:#A8453F;--ok:#2F8F63}\n@font-face{font-family:'Expose';src:url(\"408b5959-5b5e-4379-a260-ad8491cae186\") format('woff2'),url(\"6bd983fe-2ffd-402c-80d3-fceff9c40cb8\") format('truetype');font-weight:400 900;font-style:normal;font-display:swap}\nhtml,body{margin:0;height:100%}\nbody{font-family:'Expose',system-ui,sans-serif;background:var(--bg);-webkit-font-smoothing:antialiased;letter-spacing:-0.005em}\na{color:var(--accent)}a:hover{opacity:0.8}\n*{box-sizing:border-box}\n::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:color-mix(in oklab,var(--muted) 35%,transparent);border-radius:9px;border:3px solid transparent;background-clip:content-box}\n@keyframes omUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}\n@keyframes omPopIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"display:flex;height:100vh;overflow:hidden;color:var(--ink);background:var(--bg)\">\n\n  <div style=\"width:76px;flex:none;background:var(--railBg);display:flex;flex-direction:column;align-items:stretch;position:relative;z-index:40;overflow:hidden\">\n  <div style=\"flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;align-items:center;padding:14px 0 8px;gap:4px\">\n    <div style=\"width:36px;height:36px;border-radius:10px;background:#FFFFFF;color:#211F1B;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;letter-spacing:-0.03em;margin-bottom:12px\">H<\u002Fdiv>\n\n    <div sc-camel-on-click=\"{{goTags}}\" style=\"width:60px;padding:9px 0 7px;border-radius:var(--rad);display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;background:{{tagsBg}};color:{{tagsFg}};position:relative;transition:background 0.18s,color 0.18s\" style-hover=\"color:#EDE9E0\">\n      <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><path d=\"M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8M13.7 20a2 2 0 0 1-3.4 0\"><\u002Fpath><\u002Fsvg>\n      <span style=\"font-size:10px;font-weight:550;letter-spacing:0.01em\">Activity<\u002Fspan>\n      <sc-if value=\"{{tagCount}}\" hint-placeholder-val=\"{{ false }}\">\n        <span style=\"position:absolute;top:5px;right:8px;min-width:16px;height:16px;border-radius:11px;background:var(--accent);color:#fff;font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 4px\">{{tagCount}}<\u002Fspan>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <div style=\"width:44px;height:1px;background:#3C382F;margin:7px 0 9px;flex:none\"><\u002Fdiv>\n\n    <sc-for list=\"{{rail}}\" as=\"r\" hint-placeholder-count=\"5\">\n      <div sc-camel-on-click=\"{{r.go}}\" style=\"width:60px;padding:9px 0 7px;border-radius:var(--rad);display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;background:{{r.bg}};color:{{r.fg}};position:relative;transition:background 0.18s,color 0.18s\" style-hover=\"color:#EDE9E0\">\n        <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><path d=\"{{r.icon}}\"><\u002Fpath><\u002Fsvg>\n        <span style=\"font-size:10px;font-weight:550;letter-spacing:0.01em\">{{r.short}}<\u002Fspan>\n        <sc-if value=\"{{r.dot}}\" hint-placeholder-val=\"{{ false }}\">\n          <span style=\"position:absolute;top:7px;right:11px;width:6px;height:6px;border-radius:50%;background:#E0913B\"><\u002Fspan>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n\n    <div style=\"flex:1\"><\u002Fdiv>\n\n    <div sc-camel-on-click=\"{{toggleFeed}}\" style=\"width:60px;padding:9px 0 7px;border-radius:var(--rad);display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;color:{{feedFg}};background:{{feedBg}};position:relative\">\n      <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><path d=\"M3 12h3.5l2-6 3.5 12 2.5-8 1.8 4H21\"><\u002Fpath><\u002Fsvg>\n      <span style=\"font-size:10px;font-weight:550\">Alerts<\u002Fspan>\n      <sc-if value=\"{{feedCount}}\" hint-placeholder-val=\"{{ false }}\">\n        <span style=\"position:absolute;top:5px;right:8px;min-width:16px;height:16px;border-radius:11px;background:var(--accent);color:#fff;font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 4px\">{{feedCount}}<\u002Fspan>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div sc-camel-on-click=\"{{openBug}}\" title=\"Report a bug\" style=\"width:60px;padding:9px 0 7px;border-radius:var(--rad);display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;color:var(--railMuted)\" style-hover=\"color:#EDE9E0\">\n      <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><path d=\"M12 3.5a4 4 0 0 1 4 4v1H8v-1a4 4 0 0 1 4-4zM8 8.5h8v5.5a4 4 0 0 1-8 0zM4.5 11h3.5M16 11h3.5M5.5 16.5 8 15M18.5 16.5 16 15M6.5 6.5 8.5 8M17.5 6.5 15.5 8\"><\u002Fpath><\u002Fsvg>\n      <span style=\"font-size:9.5px;font-weight:550;text-align:center;line-height:1.2\">Report<br>a bug<\u002Fspan>\n    <\u002Fdiv>\n\n    <div sc-camel-on-click=\"{{toggleRoles}}\" style=\"width:60px;padding:8px 0;border-radius:var(--rad);display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;background:{{roleBg}}\">\n      <span style=\"width:30px;height:30px;border-radius:50%;background:#3C382F;color:#EDE9E0;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:600\">{{userInitials}}<\u002Fspan>\n      <span style=\"font-size:9.5px;color:var(--railMuted);font-weight:550;text-align:center;line-height:1.2\">{{userShort}}<\u002Fspan>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n\n    <div title=\"Build stamp — check this matches the build you were sent\" style=\"flex:none;padding:8px 0 10px;background:var(--railBg);border-top:1px solid #3C382F;display:flex;flex-direction:column;align-items:center;color:var(--railInk);font-size:10px;font-weight:600;letter-spacing:0.02em;text-align:center;line-height:1.3\">\n      <span>build<\u002Fspan>\n      <span>{{buildShort}}<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{picking}}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;z-index:90;cursor:crosshair;pointer-events:none\"><\u002Fdiv>\n    <div style=\"position:fixed;left:{{pickL}};top:{{pickT}};width:{{pickW}};height:{{pickH}};border:2px solid var(--accent);background:color-mix(in oklab,var(--accent) 12%,transparent);border-radius:4px;z-index:91;pointer-events:none;transition:all 0.08s linear\"><\u002Fdiv>\n    <div style=\"position:fixed;left:50%;top:20px;transform:translateX(-50%);z-index:92;background:var(--railBg);color:var(--railInk);border-radius:99px;padding:10px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 12px 30px rgba(40,36,30,0.3);font-size:13px;font-weight:500\">\n      <span>Click the thing that’s wrong<\u002Fspan>\n      <span sc-camel-on-click=\"{{skipPick}}\" style=\"font-size:12.5px;color:var(--railMuted);cursor:pointer;text-decoration:underline\" style-hover=\"color:var(--railInk)\">Skip<\u002Fspan>\n      <span sc-camel-on-click=\"{{cancelPick}}\" style=\"font-size:12.5px;color:var(--railMuted);cursor:pointer\" style-hover=\"color:var(--railInk)\">Cancel<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{bugOpen}}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{closeBug}}\" style=\"position:fixed;inset:0;background:rgba(33,31,27,0.34);z-index:80\"><\u002Fdiv>\n    <div style=\"position:fixed;inset:0;z-index:81;display:flex;align-items:center;justify-content:center;pointer-events:none;padding:20px\">\n    <div style=\"width:min(520px,94vw);max-height:88vh;overflow:auto;pointer-events:auto;background:var(--surf);border-radius:var(--rad);box-shadow:0 22px 54px rgba(40,36,30,0.26);padding:20px;display:flex;flex-direction:column;gap:13px;animation:omPopIn 0.18s ease both\">\n      <div style=\"display:flex;align-items:flex-start;gap:10px\">\n        <div style=\"flex:1;display:flex;flex-direction:column;gap:3px\">\n          <span style=\"font-size:16.5px;font-weight:600;letter-spacing:-0.02em\">Report a bug<\u002Fspan>\n          <span style=\"font-size:12.5px;color:var(--muted)\">{{bugContext}}<\u002Fspan>\n          <sc-if value=\"{{queuedNote}}\" hint-placeholder-val=\"{{ false }}\">\n            <span style=\"font-size:11.5px;color:#8A6A24;background:#F6EEDC;border-radius:var(--radSm);padding:7px 9px;line-height:1.45;margin-top:4px\">{{queuedNote}}<\u002Fspan>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <span sc-camel-on-click=\"{{closeBug}}\" style=\"font-size:20px;line-height:1;color:var(--muted);cursor:pointer\" style-hover=\"color:var(--ink)\">×<\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;align-items:flex-start;gap:9px;background:var(--surf2);border-radius:var(--radSm);padding:9px 12px\">\n        <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;margin-top:2px\"><path d=\"M4 4l7 16 2.5-6.5L20 11z\"><\u002Fpath><\u002Fsvg>\n        <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:2px\">\n          <span style=\"font-size:12.5px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{bugTargetLabel}}<\u002Fspan>\n          <span style=\"font-size:11px;color:var(--muted);line-height:1.4\">{{bugTargetWhere}}<\u002Fspan>\n        <\u002Fdiv>\n        <span sc-camel-on-click=\"{{startPick}}\" style=\"font-size:12px;font-weight:600;color:var(--accent);cursor:pointer;white-space:nowrap;margin-top:2px\" style-hover=\"opacity:0.75\">{{pickVerb}}<\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:6px\">\n        <span style=\"font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.07em\">How bad is it<\u002Fspan>\n        <div style=\"display:flex;gap:7px\">\n          <sc-for list=\"{{sevs}}\" as=\"sv\" hint-placeholder-count=\"3\">\n            <span sc-camel-on-click=\"{{sv.pick}}\" style=\"flex:1;text-align:center;font-size:12.5px;font-weight:{{sv.weight}};color:{{sv.fg}};border:1.5px solid {{sv.bd}};background:{{sv.bg}};border-radius:var(--radSm);padding:8px 0;cursor:pointer\">{{sv.label}}<\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:6px\">\n        <span style=\"font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.07em\">What went wrong<\u002Fspan>\n        <textarea value=\"{{bugNote}}\" sc-camel-on-change=\"{{setBugNote}}\" rows=\"3\" placeholder=\"The sourcing status stayed empty after I saved…\" style=\"font-family:inherit;font-size:13.5px;line-height:1.5;color:var(--ink);background:var(--inputBg);border:var(--bw) solid var(--line);border-radius:var(--radSm);padding:11px 13px;outline:none;resize:vertical\" style-focus=\"box-shadow:0 0 0 1.5px var(--accent) = e.detail || {}; this.setState(st => ({ msgUnread: d.messages == null ? st.msgUnread : d.messages, tagUnread: d.activity == null ? st.tagUnread : d.activity })); };\n    window.addEventListener('hanooot:counts', this._counts);\n    this._open = e => { const d = (e.detail || {}); if (d.dept) this.setState({ section: d.dept, feedOpen: false, rolesOpen: false }); };\n    window.addEventListener('hanooot:open', this._open);\n    setTimeout(() => this.flushQueue(), 1500);\n  }\n  componentWillUnmount() {\n    if (this._un) this._un();\n    window.removeEventListener('keydown', this._esc);\n    window.removeEventListener('hanooot:open', this._open);\n    window.removeEventListener('hanooot:counts', this._counts);\n  }\n\n  signIn() {\n    if (!this.P) return;\n    const r = this.P.signIn(this.state.loginUser, this.state.loginPass);\n    if (!r.ok) { this.setState({ loginError: r.error }); return; }\n    const allowed = this.P.visibleDepts();\n    this.setState({ loginUser: '', loginPass: '', loginError: '', section: allowed.includes('home') ? 'home' : allowed[0] });\n  }\n  describeEl(el, pt) {\n    if (!el) return null;\n    let n = el, screen = '', crumbs = [];\n    while (n && n !== document.body) {\n      const d = n.dataset || {};\n      if (d.screenLabel && !screen) screen = d.screenLabel;\n      if (d.omLabel) crumbs.unshift(d.omLabel);\n      n = n.parentElement;\n    }\n    const tag = el.tagName.toLowerCase();\n    const role = tag === 'input' || tag === 'textarea' ? 'field'\n      : tag === 'select' ? 'dropdown'\n      : tag === 'button' || el.getAttribute('onclick') ? 'button'\n      : tag === 'a' ? 'link' : tag === 'svg' || tag === 'path' ? 'icon' : 'element';\n    let txt = (el.innerText || el.textContent || '').trim().replace(/\\s+/g, ' ');\n    if (!txt && (tag === 'input' || tag === 'textarea')) txt = el.value || el.placeholder || '';\n    if (!txt) txt = el.getAttribute('title') || el.getAttribute('aria-label') || '';\n    txt = txt.slice(0, 70);\n    const r = el.getBoundingClientRect();\n    return {\n      tag, role, text: txt, screen,\n      path: crumbs.join(' \\u203a '),\n      where: Math.round(r.left) + ',' + Math.round(r.top) + ' \\u00b7 ' + Math.round(r.width) + '\\u00d7' + Math.round(r.height),\n      click: pt ? Math.round(pt.x) + ',' + Math.round(pt.y) : '',\n    };\n  }\n  startPicking() {\n    this.setState({ bugOpen: false, picking: true, pickRect: null });\n    const move = e => {\n      const el = document.elementFromPoint(e.clientX, e.clientY);\n      const t = el && el.closest ? (el.closest('[data-screen-label],button,a,input,select,textarea,[onclick]') || el) : el;\n      if (!t) return;\n      const r = t.getBoundingClientRect();\n      this._hit = t;\n      this.setState({ pickRect: { l: r.left, t: r.top, w: r.width, h: r.height } });\n    };\n    const click = e => {\n      e.preventDefault(); e.stopPropagation();\n      const target = this.describeEl(this._hit, { x: e.clientX, y: e.clientY });\n      this.stopPicking();\n      this.setState({ bugTarget: target, bugOpen: true });\n    };\n    const key = e => { if (e.key === 'Escape') { this.stopPicking(); this.setState({ bugOpen: true }); } };\n    this._pick = { move, click, key };\n    window.addEventListener('mousemove', move, true);\n    window.addEventListener('click', click, true);\n    window.addEventListener('keydown', key, true);\n  }\n  stopPicking() {\n    const p = this._pick;\n    if (p) {\n      window.removeEventListener('mousemove', p.move, true);\n      window.removeEventListener('click', p.click, true);\n      window.removeEventListener('keydown', p.key, true);\n      this._pick = null;\n    }\n    this.setState({ picking: false, pickRect: null });\n  }\n  detectArea() {\n    const s = this.state, t = s.bugTarget;\n    const sec = s.section === 'home' ? 'Home' : String(s.section || '').replace(/^./, c => c.toUpperCase());\n    const detail = t && (t.screen || t.path);\n    return detail ? sec + ' \\u203a ' + detail : sec;\n  }\n  reportText(id) {\n    const s = this.state, u = this.P && this.P.sessionUser, t = s.bugTarget;\n    return [\n      'Hanooot ERP bug ' + id,\n      'Who: ' + (u ? u.name + ' (' + u.title + ')' : 'not signed in'),\n      'Screen: ' + (s.section === 'home' ? 'Home' : s.section) + (t && t.screen ? ' \\u2014 ' + t.screen : ''),\n      'Element: ' + (t ? t.role + (t.text ? ' \\u201c' + t.text + '\\u201d' : ' (no label)') : 'not tagged'),\n      'Where: ' + (t ? (t.path ? t.path + ' \\u2014 ' : '') + 'box ' + t.where + (t.click ? ', clicked at ' + t.click : '') : '\\u2014'),\n      'Area: ' + this.detectArea() + ' | Severity: ' + s.bugSev,\n      'When: ' + new Date().toLocaleString('en-GB'),\n      'Browser: ' + navigator.userAgent + ' | ' + window.innerWidth + '\\u00d7' + window.innerHeight,\n      '', 'Went wrong: ' + ((s.bugNote || '').trim() || '(blank)'),\n      'Expected: ' + ((s.bugExpected || '').trim() || '(blank)'),\n    ].join('\\n');\n  }\n  async shotPng(id) {\n    try {\n      if (!window.html2canvas) {\n        await new Promise((res, rej) => {\n          const sc = document.createElement('script');\n          sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';\n          sc.onload = res; sc.onerror = rej; document.head.appendChild(sc);\n        });\n      }\n      const c = await window.html2canvas(document.body, { scale: 0.8, logging: false, useCORS: true });\n      const a = document.createElement('a');\n      a.href = c.toDataURL('image/png'); a.download = 'bug-' + id + '.png';\n      a.click();\n      return true;\n    } catch (e) { return false; }\n  }\n  async sendBug() {\n    if (this.state.bugSending) return;\n    const s = this.state;\n    if (!(s.bugNote || '').trim()) { this.setState({ bugStatus: 'Tell us what went wrong first.', bugOk: false }); return; }\n    const id = 'R' + Date.now().toString(36).toUpperCase().slice(-6);\n    this.setState({ bugSending: true, bugStatus: 'Sending\\u2026', bugOk: true });\n    const u = this.P && this.P.sessionUser, t = s.bugTarget;\n    const shot = await this.shotPng(id);\n    let sent = false;\n    if (REPORT_ENDPOINT) {\n      try {\n        const body = new URLSearchParams({\n          id, who: u ? u.name : 'not signed in', role: u ? u.title : '',\n          screen: s.section === 'home' ? 'Home' : s.section,\n          element: t ? t.role + (t.text ? ' \\u201c' + t.text + '\\u201d' : '') : 'not tagged',\n          location: t ? (t.path ? t.path + ' \\u2014 ' : '') + 'box ' + t.where + (t.click ? ', clicked ' + t.click : '') : '',\n          area: this.detectArea(), severity: s.bugSev,\n          wrong: s.bugNote || '', expected: s.bugExpected || '',\n          when: new Date().toISOString(), browser: navigator.userAgent,\n          viewport: window.innerWidth + '\\u00d7' + window.innerHeight,\n        });\n        sent = await this.deliver(body);\n      } catch (e) { sent = false; }\n    }\n    if (!sent) {\n      const txt = this.reportText(id);\n      try { await navigator.clipboard.writeText(txt); } catch (e) {}\n    }\n    this.setState({\n      bugSending: false, bugOk: true,\n      bugStatus: (sent\n        ? 'Sent and confirmed \\u2014 thanks. Reference ' + id + '.'\n        : 'Saved on this device as ' + id + ' and copied to your clipboard. It could not be confirmed, so it will resend automatically next time you open this file \\u2014 send the clipboard text to Mustafa if it is urgent.')\n        + (shot ? ' The screenshot downloaded as bug-' + id + '.png \\u2014 send that too.' : ''),\n      bugNote: '', bugExpected: '', bugTarget: null,\n    });\n  }\n  // The report is written to this device first, then sent. Only a reply we can\n  // actually read counts as delivered; anything else stays queued and is retried\n  // on the next open, so a dropped report is never silently lost.\n  async deliver(body) {\n    const s = body.toString();\n    this.queue(s);\n    const ok = await this.attempt(s);\n    if (ok) this.unqueue(s);\n    this.setState({ queued: this.readQueue().length });\n    return ok;\n  }\n  // A readable JSON reply is proof the row was written. A no-cors POST is fired\n  // as a backstop but tells us nothing, so it never counts as confirmation.\n  async attempt(s) {\n    const body = new URLSearchParams(s);\n    // Any readable 2xx reply means the row was written. The sheet script may\n    // answer with JSON or a plain \"ok\" — both count.\n    try {\n      const r = await fetch(REPORT_ENDPOINT, { method: 'POST', body });\n      if (this.confirmed(r, await r.text())) return true;\n    } catch (e) {}\n    try {\n      const r2 = await fetch(REPORT_ENDPOINT + (REPORT_ENDPOINT.indexOf('?') < 0 ? '?' : '&') + s);\n      if (this.confirmed(r2, await r2.text())) return true;\n    } catch (e) {}\n    try { await fetch(REPORT_ENDPOINT, { method: 'POST', mode: 'no-cors', keepalive: true, body }); } catch (e) {}\n    return false;\n  }\n  confirmed(r, text) {\n    if (!r || !r.ok) return false;\n    const t = (text || '').trim();\n    if (/^\\s*[{[]/.test(t)) { try { const d = JSON.parse(t); return d.ok !== false; } catch (e) { return false; } }\n    return /\\bok\\b/i.test(t) || /success/i.test(t);\n  }\n  readQueue() {\n    try { return JSON.parse(localStorage.getItem('hanooot:bugQueue') || '[]'); } catch (e) { return []; }\n  }\n  writeQueue(q) {\n    try { localStorage.setItem('hanooot:bugQueue', JSON.stringify(q.slice(-30))); } catch (e) {}\n  }\n  queue(s) { const q = this.readQueue(); if (q.indexOf(s) < 0) { q.push(s); this.writeQueue(q); } }\n  unqueue(s) { this.writeQueue(this.readQueue().filter(x => x !== s)); }\n  async flushQueue() {\n    if (!REPORT_ENDPOINT) return;\n    for (const s of this.readQueue()) {\n      if (await this.attempt(s)) this.unqueue(s);\n    }\n    this.setState({ queued: this.readQueue().length });\n  }\n  copyBug() {\n    const u = this.P && this.P.sessionUser;\n    const lines = [\n      'Hanooot ERP — bug report',\n      'Who: ' + (u ? u.name + ' (' + u.title + ')' : 'unknown'),\n      'Screen: ' + (this.state.section === 'home' ? 'Home' : this.state.section),\n      'When: ' + new Date().toLocaleString('en-GB'),\n      'Browser: ' + navigator.userAgent,\n      'Window: ' + window.innerWidth + '×' + window.innerHeight,\n      '',\n      'Problem:',\n      (this.state.bugNote || '').trim() || '(no description)',\n    ].join('\\n');\n    const done = () => this.setState({ bugCopied: true });\n    if (navigator.clipboard) navigator.clipboard.writeText(lines).then(done, done);\n    else done();\n  }\n  setRole(key) {\n    if (!this.P) return;\n    this.P.setRole(key);\n    const allowed = this.ROLES[key].depts;\n    this.setState(s => ({ rolesOpen: false, section: allowed.includes(s.section) ? s.section : 'home' }));\n  }\n\n  renderVals() {\n    const s = this.state;\n    const depts = this.DEPTS || [];\n    const user = this.P ? this.P.user : null;\n    const activity = this.P ? this.P.activity : [];\n    const unread = Math.max(0, activity.length - s.read);\n\n    const rail = depts.filter(d => !this.P || this.P.can(d.id)).map(d => ({\n      short: d.short, icon: d.icon,\n      bg: s.section === d.id ? '#3C382F' : 'transparent',\n      fg: s.section === d.id ? '#FFFFFF' : 'var(--railMuted)',\n      dot: d.id === 'hr' && this.P ? activity.some(a => a.dept === 'hr' && a.text.indexOf('awaiting') > -1) : false,\n      go: () => this.setState({ section: d.id, feedOpen: false, rolesOpen: false }),\n    }));\n\n    const feed = activity.slice(0, 8).map(a => {\n      const tone = DEPT_TONE[a.dept] || DEPT_TONE.settings;\n      const label = (depts.find(d => d.id === a.dept) || { label: 'Platform' }).label;\n      return { text: a.text, when: a.when, dept: label, color: tone[1], tagBg: tone[0], tagFg: tone[1] };\n    });\n\n    const canSee = id => !this.P || this.P.can(id);\n\n    return {\n      lockedOut: s.loaded && this.P ? !this.P.signedIn : false,\n      buildStamp: BUILD,\n      buildShort: BUILD.split('\\u00b7').pop().trim(),\n      queuedNote: s.queued ? s.queued + ' report' + (s.queued > 1 ? 's' : '') + ' waiting to reach the sheet — they resend on next open.' : '',\n      noStorage: !!(this.P && this.P.storageOk === false),\n      loginUser: s.loginUser, setLoginUser: e => this.setState({ loginUser: e.target.value, loginError: '' }),\n      loginPass: s.loginPass, setLoginPass: e => this.setState({ loginPass: e.target.value, loginError: '' }),\n      passType: s.loginShow ? 'text' : 'password',\n      passHidden: !s.loginShow, passShown: !!s.loginShow,\n      togglePass: () => this.setState(st => ({ loginShow: !st.loginShow })),\n      loginError: s.loginError,\n      loginKey: e => { if (e.key === 'Enter') this.signIn(); },\n      doLogin: () => this.signIn(),\n      doSignOut: () => { if (this.P) { this.P.signOut(); this.setState({ rolesOpen: false, section: 'home', loginUser: '', loginPass: '', loginError: '' }); } },\n\n      picking: s.picking,\n      pickL: (s.pickRect ? s.pickRect.l : 0) + 'px',\n      pickT: (s.pickRect ? s.pickRect.t : 0) + 'px',\n      pickW: (s.pickRect ? s.pickRect.w : 0) + 'px',\n      pickH: (s.pickRect ? s.pickRect.h : 0) + 'px',\n      startPick: () => this.startPicking(),\n      skipPick: () => { this.stopPicking(); this.setState({ bugOpen: true, bugTarget: null }); },\n      cancelPick: () => { this.stopPicking(); this.setState({ bugOpen: true }); },\n      pickVerb: s.bugTarget ? 'Pick again' : 'Point at it',\n      bugTargetLabel: s.bugTarget\n        ? (s.bugTarget.text || s.bugTarget.role) + ' \\u00b7 ' + s.bugTarget.role\n        : 'Nothing tagged yet',\n      bugTargetWhere: s.bugTarget\n        ? (s.bugTarget.screen ? s.bugTarget.screen + ' \\u00b7 ' : '') + (s.bugTarget.path ? s.bugTarget.path + ' \\u00b7 ' : '') + 'at ' + s.bugTarget.where\n        : 'Point at the thing that\\u2019s wrong and it gets tagged with its exact spot',\n      sevs: ['Blocking', 'Annoying', 'Cosmetic'].map(label => {\n        const on = s.bugSev === label;\n        return { label, pick: () => this.setState({ bugSev: label }),\n          bd: on ? 'var(--accent)' : 'var(--line)',\n          bg: on ? 'color-mix(in oklab,var(--accent) 8%,var(--surf))' : 'var(--surf)',\n          fg: on ? 'var(--accent)' : 'var(--ink)', weight: on ? '600' : '500' };\n      }),\n      areaOptions: [],\n      bugArea: this.detectArea(), setBugArea: () => {},\n      bugExpected: s.bugExpected, setBugExpected: e => this.setState({ bugExpected: e.target.value }),\n      sendLabel: s.bugSending ? 'Sending\\u2026' : 'Send report',\n      sendBug: () => this.sendBug(),\n      bugStatus: s.bugStatus,\n      bugStatusFg: s.bugOk ? 'var(--ok)' : 'var(--danger)',\n\n      bugOpen: s.bugOpen,\n      openBug: () => { this.setState({ bugStatus: '', bugTarget: null }); this.startPicking(); },\n      closeBug: () => this.setState({ bugOpen: false, bugStatus: '' }),\n      bugNote: s.bugNote, setBugNote: e => this.setState({ bugNote: e.target.value }),\n      bugContext: (user ? user.name : 'Tester') + ' · ' + (s.section === 'home' ? 'Home' : s.section) + ' · ' + new Date().toLocaleString('en-GB'),\n      copyBug: () => this.copyBug(),\n      resetDemo: () => { if (this.P && confirm('Wipe all saved test data on this device and start fresh?')) this.P.clearAllData(); },\n\n      rail,\n      isHome: s.section === 'home',\n      tagsMount: s.section === 'tags' ? SHOWN : HIDDEN,\n      goTags: () => this.setState({ section: 'tags', feedOpen: false, rolesOpen: false }),\n      tagsBg: s.section === 'tags' ? '#3C382F' : 'transparent',\n      tagsFg: s.section === 'tags' ? '#FFFFFF' : 'var(--railMuted)',\n      tagCount: s.tagUnread == null ? 2 : s.tagUnread,\n      legalMount: s.section === 'legal' && canSee('legal') ? SHOWN : HIDDEN,\n      hrMount: s.section === 'hr' && canSee('hr') ? SHOWN : HIDDEN,\n      importingMount: s.section === 'importing' && canSee('importing') ? SHOWN : HIDDEN,\n      driveMount: s.section === 'drive' && canSee('drive') ? SHOWN : HIDDEN,\n      settingsMount: s.section === 'settings' && canSee('settings') ? SHOWN : HIDDEN,\n\n      userInitials: user ? user.initials : '··',\n      userShort: user ? user.name.split(' ')[0] : '',\n      roleBg: s.rolesOpen ? '#3C382F' : 'transparent',\n      toggleRoles: () => this.setState(st => ({ rolesOpen: !st.rolesOpen, feedOpen: false })),\n      rolesOpen: s.rolesOpen,\n      meInitials: user ? user.initials : '··',\n      meName: user ? user.name : 'Not signed in',\n      meLabel: user ? user.label : '',\n      meEmail: this.P && this.P.sessionUser ? (this.P.sessionUser.email || '') : '',\n\n      feedOpen: s.feedOpen,\n      feedCount: unread || 0,\n      feedBg: s.feedOpen ? '#3C382F' : 'transparent',\n      feedFg: s.feedOpen ? '#FFFFFF' : 'var(--railMuted)',\n      toggleFeed: () => this.setState(st => ({ feedOpen: !st.feedOpen, rolesOpen: false, read: activity.length })),\n      markRead: () => this.setState({ read: activity.length }),\n      feed,\n\n      today: '27 August 2026',\n      greeting: user ? user.name + ' · ' + user.label : '',\n\n      kpis: [\n        { label: 'REVENUE MTD', value: '$118,600', note: '+11% vs. July', color: 'var(--ok)' },\n        { label: 'OPEN WORK ITEMS', value: '17', note: '11 import · 6 accounting', color: 'var(--muted)' },\n        { label: 'SHIPMENTS IN TRANSIT', value: '6', note: '1 delayed at Aqaba', color: 'var(--warnFg)' },\n        { label: 'HEADCOUNT', value: '13', note: '7 departments', color: 'var(--muted)' },\n      ],\n\n      deptCards: depts.filter(d => d.id !== 'home' && d.id !== 'settings' && d.id !== 'drive' && canSee(d.id)).map(d => ({\n        label: d.label, icon: d.icon, tagline: TAGLINE[d.id],\n        tint: DEPT_TONE[d.id][0], ink: DEPT_TONE[d.id][1],\n        go: () => this.setState({ section: d.id }),\n        stats: {\n          legal: [\n            { value: '6', label: 'Open enquiries' },\n            { value: '$20,800', label: 'Weighted pipeline' },\n
